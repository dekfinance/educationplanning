<style>
/* layout: answer (tiles + timeline chart) on top, inputs below; single scannable column */
:root{
  --bg:#F5F8F9; --card:#FFFFFF; --ink:#15303A; --muted:#5E7681; --line:#E3ECEF;
  --accent:#0E7C86; --accent-deep:#0A5A62; --accent-soft:#E2F1F2;
  --gold:#C58A1A; --gold-soft:#FAF1DD;
  --good:#1A9E6B; --good-soft:#E3F5EC; --warn:#C97F00; --warn-soft:#FBF0DA; --bad:#DB4F3A; --bad-soft:#FBE6E1;
  --display:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --body:'Noto Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1619; --card:#16232A; --ink:#E7F0F2; --muted:#9FB4BC; --line:#27343A;
  --accent:#2BB5C0; --accent-deep:#1C8D97; --accent-soft:#143037;
  --gold:#E0AC45; --gold-soft:#302612;
  --good:#3FC78A; --good-soft:#123024; --warn:#E6A52E; --warn-soft:#332814; --bad:#F0705A; --bad-soft:#39211C;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1619; --card:#16232A; --ink:#E7F0F2; --muted:#9FB4BC; --line:#27343A;
  --accent:#2BB5C0; --accent-deep:#1C8D97; --accent-soft:#143037;
  --gold:#E0AC45; --gold-soft:#302612;
  --good:#3FC78A; --good-soft:#123024; --warn:#E6A52E; --warn-soft:#332814; --bad:#F0705A; --bad-soft:#39211C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 56px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}
button{font-family:var(--body);cursor:pointer}
input{font-family:var(--body);accent-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const PRESETS = {
  thai:    {pre:40000,  pri:60000,  sec:70000,  bac:40000,  mas:60000,  entry:20000},
  ep:      {pre:120000, pri:180000, sec:220000, bac:200000, mas:200000, entry:50000},
  inter:   {pre:350000, pri:500000, sec:650000, bac:350000, mas:400000, entry:100000},
  overseas:{bac:1800000, mas:1500000, entry:100000},
};

function compute(s){
  const effAge = s.born ? s.age : -s.toBirth;
  const masStart = 18 + s.bacYears;
  const stages=[];
  if(s.incPre) stages.push({k:"pre",start:3,years:3});
  stages.push({k:"pri",start:6,years:6});
  stages.push({k:"sec",start:12,years:6});
  stages.push({k:"bac",start:18,years:s.bacYears});
  if(s.incMas) stages.push({k:"mas",start:masStart,years:s.masYears});
  const infl=s.infl/100;
  const tier=k=>{ if(k==="bac"&&s.bacOverseas)return"overseas"; if(k==="mas"&&s.masOverseas)return"overseas"; return s.tiers[k]||s.globalTier; };
  const annual=k=> s.cost[k]!=null? s.cost[k] : PRESETS[tier(k)][k];
  const entry=k=> PRESETS[tier(k)].entry;
  let items=[]; const stageTotals={}; const flags=[];
  stages.forEach(st=>{
    let tot=0, flagged=false;
    for(let y=0;y<st.years;y++){
      const childAge=st.start+y, t=childAge-effAge;
      if(t<0) continue;
      let c=annual(st.k)*Math.pow(1+infl,t);
      if(y===0) c+=entry(st.k)*Math.pow(1+infl,t);
      items.push({t,k:st.k,cost:c}); tot+=c;
      if(!flagged){ flags.push({t,k:st.k}); flagged=true; }
    }
    stageTotals[st.k]={total:tot,tier:tier(st.k),years:st.years,start:st.start,annual:annual(st.k)};
  });
  const H=items.length? Math.max(...items.map(i=>i.t)) : 0;
  const tuition=Array(H+1).fill(0), stageOf=Array(H+1).fill(null);
  items.forEach(i=>{ tuition[i.t]+=i.cost; if(stageOf[i.t]==null) stageOf[i.t]=i.k; });
  const totalNominal=tuition.reduce((a,b)=>a+b,0);
  const r=s.ret/100;
  const sim=C=>{ let f=s.lump; const path=[]; for(let t=0;t<=H;t++){ f=f*(1+r)+C*12-(tuition[t]||0); path.push(f);} return path; };
  const okAt=C=>Math.min(...sim(C))>=-1;
  let required, lo=0, hi=1000000;
  if(okAt(0)) required=0;
  else if(!okAt(hi)) required=hi;
  else { for(let i=0;i<42;i++){ const mid=(lo+hi)/2; if(okAt(mid))hi=mid; else lo=mid; } required=hi; }
  const ownC = s.ownSave!=null? s.ownSave : Math.ceil(required/500)*500;
  const ownPath=sim(ownC);
  let shortfallYear=null; for(let t=0;t<=H;t++){ if(ownPath[t]<-1){shortfallYear=t;break;} }
  return {effAge,H,tuition,stageOf,flags,totalNominal,stageTotals,required,ownC,ownPath,shortfallYear,endBal:ownPath[H],stages};
}

function Tile({label,value,sub,accent,gold,bad}){
  const bg=bad?"var(--bad-soft)":gold?"var(--gold-soft)":accent?"var(--accent-soft)":"var(--card)";
  const fg=bad?"var(--bad)":gold?"var(--gold)":accent?"var(--accent-deep)":"var(--ink)";
  return <div style={{flex:"1 1 150px",background:bg,border:"1px solid var(--line)",borderRadius:12,padding:"11px 13px"}}>
    <div style={{fontSize:10.5,color:"var(--muted)",fontWeight:600}}>{label}</div>
    <div className="num" style={{fontSize:18,fontWeight:800,color:fg}}>{value}</div>
    {sub&&<div style={{fontSize:10.5,color:"var(--muted)"}}>{sub}</div>}</div>;
}
function MoneyInput({value,onChange,w=120}){
  return <input value={value?fmt(value):""} inputMode="numeric" placeholder="0"
    onChange={e=>{const n=parseInt(e.target.value.replace(/[^\d]/g,""),10);onChange(isNaN(n)?0:n);}}
    style={{width:w,textAlign:"right",border:"1px solid var(--line)",borderRadius:8,padding:"7px 9px",fontSize:14,background:"var(--bg)",color:"var(--ink)"}} className="num" />;
}
function Chip({on,onClick,children,color}){
  return <button onClick={onClick} style={{padding:"7px 13px",borderRadius:20,fontSize:12.5,fontWeight:700,border:"none",
    background:on?(color||"var(--accent)"):"var(--card)",color:on?"#fff":"var(--muted)",boxShadow:on?"none":"inset 0 0 0 1px var(--line)"}}>{children}</button>;
}
function Stepper({value,set,min,max,suffix}){
  return <span style={{display:"inline-flex",alignItems:"center",gap:8}}>
    <button onClick={()=>set(Math.max(min,value-1))} style={stepBtn}>−</button>
    <span className="num" style={{minWidth:46,textAlign:"center",fontWeight:700,fontSize:14}}>{value}{suffix}</span>
    <button onClick={()=>set(Math.min(max,value+1))} style={stepBtn}>+</button></span>;
}
const stepBtn={width:30,height:30,borderRadius:8,border:"1px solid var(--line)",background:"var(--card)",color:"var(--ink)",fontSize:16,fontWeight:700,lineHeight:1};

function BarLine({tuition,fund,stageOf,flags,height=240}){
  const W=680,H=height,padL=48,padR=14,padT=16,padB=26;
  const n=tuition.length;
  const ymax=Math.max(...tuition, ...fund.map(f=>Math.max(0,f)),1)*1.12;
  const X=i=> padL+(n<=1?0:i/(n-1))*(W-padL-padR);
  const Y=v=> H-padB-(Math.max(0,v)/ymax)*(H-padT-padB);
  const bw=Math.max(3,(W-padL-padR)/n*0.5);
  const grid=[0,.5,1].map(f=>f*ymax);
  const fundPath=fund.map((f,i)=>(i?"L":"M")+X(i)+" "+Y(f)).join(" ");
  return <div style={{overflowX:"auto"}}>
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:"100%",minWidth:340,display:"block"}} role="img">
      {grid.map((g,i)=><g key={i}><line x1={padL} y1={Y(g)} x2={W-padR} y2={Y(g)} stroke="var(--line)"/>
        <text x={padL-6} y={Y(g)+3} textAnchor="end" fontSize="10" fill="var(--muted)" className="num">{compact(g)}</text></g>)}
      {flags.map((fl,i)=><g key={"fl"+i}><line x1={X(fl.t)} y1={padT} x2={X(fl.t)} y2={H-padB} stroke={SC[fl.k]} strokeWidth="1" strokeDasharray="3 3" opacity="0.45"/>
        <text x={X(fl.t)} y={padT-4} textAnchor="middle" fontSize="9" fill={SC[fl.k]} fontWeight="700">{SL[fl.k]}</text></g>)}
      {tuition.map((v,i)=> v>0? <rect key={i} x={X(i)-bw/2} y={Y(v)} width={bw} height={Math.max(0,H-padB-Y(v))} rx="2" fill={SC[stageOf[i]]||"var(--muted)"} opacity="0.92"/>:null)}
      <path d={fundPath} fill="none" stroke="var(--ink)" strokeWidth="2.6" strokeLinejoin="round"/>
      <circle cx={X(n-1)} cy={Y(fund[n-1])} r="3.6" fill="var(--ink)"/>
      {tuition.map((v,i)=> (i%Math.ceil(n/12||1)===0||i===n-1)? <text key={"x"+i} x={X(i)} y={H-8} textAnchor="middle" fontSize="9" fill="var(--muted)" className="num">{i}</text>:null)}
    </svg>
    <div style={{display:"flex",gap:14,flexWrap:"wrap",fontSize:11,color:"var(--muted)",padding:"2px 4px 0 48px"}}>
      <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:14,height:3,background:"var(--ink)"}}></span>เงินกองทุนคงเหลือ</span>
      <span style={{display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:12,height:10,background:"var(--muted)",borderRadius:2}}></span>ค่าเล่าเรียนรายปี (สีตามระดับชั้น)</span>
      <span style={{color:"var(--muted)"}}>แกนนอน = จำนวนปีจากนี้</span>
    </div>
  </div>;
}

function App(){
  const [s,setS]=useState({
    born:true, age:0, toBirth:0, globalTier:"thai", incPre:true, incMas:false,
    bacYears:4, masYears:2, bacOverseas:false, masOverseas:false,
    tiers:{}, cost:{}, infl:3, ret:5, lump:0, ownSave:null, adv:false,
  });
  const up=patch=>setS({...s,...patch});
  const d=useMemo(()=>compute(s),[s]);

  const INFL_DEF={thai:3,ep:4,inter:5};
  const setGlobal=t=>setS({...s,globalTier:t,tiers:{},cost:{},infl:INFL_DEF[t]});
  const setStageTier=(k,t)=>{ const tiers={...s.tiers,[k]:t}; const cost={...s.cost}; delete cost[k]; setS({...s,tiers,cost}); };

  const Sl=(label,val,min,max,step,key,suf)=>(
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",fontSize:12.5,marginBottom:3}}>
        <span style={{color:"var(--muted)"}}>{label}</span><span className="num" style={{fontWeight:700}}>{val}{suf}</span></div>
      <input type="range" min={min} max={max} step={step} value={val} onChange={e=>up({[key]:+e.target.value})} style={{width:"100%"}} /></div>);

  const card={border:"1px solid var(--line)",borderRadius:14,background:"var(--card)",padding:"14px",marginBottom:12};
  const stages = d.stages.map(st=>st.k);

  return <div className="wrap">
    <div style={{display:"flex",alignItems:"center",gap:11,marginBottom:14}}>
      <img src={LOGO} alt="DekFinance" style={{height:42}} />
      <div><h1 style={{fontSize:19,color:"var(--accent)",letterSpacing:-0.3}}>วางแผนทุนการศึกษาลูก</h1>
        <div style={{fontSize:11.5,color:"var(--muted)"}}>Education Fund Planner by เด็กการเงิน</div></div>
    </div>

    {/* ANSWER: tiles */}
    <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
      <Tile label="ค่าการศึกษารวม (ตามค่าเงินอนาคต)" value={baht(d.totalNominal)} sub={`ตั้งแต่ ${s.born?`ลูกอายุ ${s.age} ปี`:`ก่อนเกิด ${s.toBirth} ปี`} จนจบ`} accent />
      <Tile label="ต้องออมเดือนละ (ให้ครบพอดี)" value={baht(d.required)} sub={`ผลตอบแทน ${s.ret}% · เงินตั้งต้น ${baht(s.lump)}`} gold />
      {d.shortfallYear!=null
        ? <Tile label="แผนของคุณ" value={`ขาดเงินปีที่ ${d.shortfallYear}`} sub={`ออมเดือนละ ${baht(d.ownC)} ไม่พอ`} bad />
        : <Tile label={"แผนของคุณ · ออม "+fmt(d.ownC)+"/ด."} value={baht(d.endBal)} sub="เงินคงเหลือเมื่อจบการศึกษา" />}
    </div>

    {/* ANSWER: timeline chart */}
    <div style={{...card,paddingBottom:8}}>
      <h3 style={{fontSize:14,margin:"0 0 2px"}}>ไทม์ไลน์ค่าเล่าเรียน & เงินกองทุน</h3>
      <div style={{fontSize:11.5,color:"var(--muted)",marginBottom:6}}>แท่ง = ค่าเทอมแต่ละปี (พุ่งสูงตอนเปิดเทอมแรกของแต่ละระดับ) · เส้น = เงินในกองทุนที่สะสมแล้วค่อย ๆ ถูกถอนไปจ่าย</div>
      <BarLine tuition={d.tuition} fund={d.ownPath} stageOf={d.stageOf} flags={d.flags} />
    </div>

    {/* stage summary */}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:8,marginBottom:16}}>
      {stages.map(k=>{const st=d.stageTotals[k]; return <div key={k} style={{border:"1px solid var(--line)",borderLeft:`4px solid ${SC[k]}`,borderRadius:10,background:"var(--card)",padding:"9px 11px"}}>
        <div style={{fontSize:12,fontWeight:700}}>{SLONG[k]}</div>
        <div style={{fontSize:10.5,color:"var(--muted)"}}>{TL[st.tier]} · {st.years} ปี · อายุ {st.start}{k==="bac"||k==="mas"?"+":"–"+(st.start+st.years-1)}</div>
        <div className="num" style={{fontSize:14,fontWeight:800,color:SC[k],marginTop:2}}>{baht(st.total)}</div></div>;})}
    </div>

    {/* INPUTS */}
    <h2 style={{fontSize:15,margin:"4px 0 10px"}}>1 · ลูกของคุณ</h2>
    <div style={card}>
      <div style={{display:"flex",gap:8,marginBottom:12}}>
        <Chip on={s.born} onClick={()=>up({born:true})}>เกิดแล้ว</Chip>
        <Chip on={!s.born} onClick={()=>up({born:false})}>ยังไม่เกิด / กำลังวางแผน</Chip>
      </div>
      {s.born
        ? <div style={{display:"flex",alignItems:"center",gap:12}}><span style={{fontSize:13,color:"var(--muted)"}}>อายุลูกตอนนี้</span><Stepper value={s.age} set={v=>up({age:v})} min={0} max={17} suffix=" ปี" /></div>
        : <div style={{display:"flex",alignItems:"center",gap:12}}><span style={{fontSize:13,color:"var(--muted)"}}>อีกกี่ปีจะเกิด</span><Stepper value={s.toBirth} set={v=>up({toBirth:v})} min={0} max={5} suffix=" ปี" /></div>}
    </div>

    <h2 style={{fontSize:15,margin:"4px 0 10px"}}>2 · หลักสูตร & ระดับชั้น</h2>
    <div style={card}>
      <div style={{fontSize:12.5,color:"var(--muted)",marginBottom:6}}>เลือกหลักสูตรหลัก (ใช้กับทุกระดับ แล้วปรับรายชั้นได้)</div>
      <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
        {["thai","ep","inter"].map(t=><Chip key={t} on={s.globalTier===t && Object.keys(s.tiers).length===0} onClick={()=>setGlobal(t)}>{TL[t]}</Chip>)}
      </div>
      <div style={{display:"flex",gap:16,flexWrap:"wrap",alignItems:"center",marginBottom:4}}>
        <label style={{display:"flex",alignItems:"center",gap:7,fontSize:13}}>
          <input type="checkbox" checked={s.incPre} onChange={e=>up({incPre:e.target.checked})} /> รวมอนุบาล</label>
        <span style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}>ป.ตรี <Stepper value={s.bacYears} set={v=>up({bacYears:v})} min={3} max={6} suffix=" ปี" /></span>
        <label style={{display:"flex",alignItems:"center",gap:7,fontSize:13}}>
          <input type="checkbox" checked={s.incMas} onChange={e=>up({incMas:e.target.checked})} /> รวมปริญญาโท</label>
        {s.incMas&&<span style={{display:"flex",alignItems:"center",gap:8,fontSize:13}}>ป.โท <Stepper value={s.masYears} set={v=>up({masYears:v})} min={1} max={3} suffix=" ปี" /></span>}
      </div>
      <div style={{display:"flex",gap:16,flexWrap:"wrap",marginTop:8}}>
        <label style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:"var(--muted)"}}>
          <input type="checkbox" checked={s.bacOverseas} onChange={e=>up({bacOverseas:e.target.checked})} /> ป.ตรี ต่างประเทศ</label>
        {s.incMas&&<label style={{display:"flex",alignItems:"center",gap:7,fontSize:13,color:"var(--muted)"}}>
          <input type="checkbox" checked={s.masOverseas} onChange={e=>up({masOverseas:e.target.checked})} /> ป.โท ต่างประเทศ</label>}
      </div>

      <button onClick={()=>up({adv:!s.adv})} style={{background:"transparent",border:"none",color:"var(--accent)",fontSize:12.5,fontWeight:600,padding:"10px 0 2px"}}>
        {s.adv?"− ซ่อนการปรับแต่งรายชั้น":"+ ปรับหลักสูตร/ค่าเทอม รายชั้น"}</button>
      {s.adv && <div style={{borderTop:"1px solid var(--line)",paddingTop:10,marginTop:4}}>
        {stages.map(k=>{const st=d.stageTotals[k]; const isOverseas=(k==="bac"&&s.bacOverseas)||(k==="mas"&&s.masOverseas);
          return <div key={k} style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",padding:"6px 0",borderBottom:"1px solid var(--line)"}}>
            <span style={{width:74,fontSize:12.5,fontWeight:700,color:SC[k]}}>{SL[k]}</span>
            {!isOverseas && <span style={{display:"flex",gap:5}}>{["thai","ep","inter"].map(t=>
              <button key={t} onClick={()=>setStageTier(k,t)} style={{padding:"4px 9px",borderRadius:14,fontSize:11,fontWeight:700,border:"none",
                background:st.tier===t?SC[k]:"var(--bg)",color:st.tier===t?"#fff":"var(--muted)",boxShadow:st.tier===t?"none":"inset 0 0 0 1px var(--line)"}}>{TL[t]}</button>)}</span>}
            {isOverseas && <span style={{fontSize:11.5,color:"var(--muted)"}}>ต่างประเทศ</span>}
            <span style={{flex:1}}></span>
            <span style={{fontSize:11,color:"var(--muted)"}}>฿/ปี</span>
            <MoneyInput w={104} value={st.annual} onChange={n=>setS({...s,cost:{...s.cost,[k]:n}})} />
          </div>;})}
        <div style={{fontSize:10.5,color:"var(--muted)",marginTop:6}}>ค่าเทอมเริ่มต้นเป็นค่ากลางตลาด กทม. ปรับได้ตามโรงเรียนจริง · ปีแรกของแต่ละระดับมีค่าแรกเข้าเพิ่ม</div>
      </div>}
    </div>

    <h2 style={{fontSize:15,margin:"4px 0 10px"}}>3 · สมมติฐาน & แผนการออม</h2>
    <div style={card}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 18px"}}>
        {Sl("เงินเฟ้อค่าการศึกษา/ปี",s.infl,0,10,0.5,"infl","%")}
        {Sl("ผลตอบแทนการลงทุน/ปี",s.ret,0,12,0.5,"ret","%")}
      </div>
      <div style={{fontSize:10.5,color:"var(--muted)",marginTop:-2,marginBottom:6}}>ค่ากลางตามหลักสูตร: ไทย ~3% · EP ~4% · นานาชาติ ~5% (โรงเรียนเอกชน/นานาชาติขึ้นค่าเทอมเร็วกว่าเงินเฟ้อทางการที่ ~1–2%) — ปรับได้</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,marginTop:4,flexWrap:"wrap"}}>
        <span style={{fontSize:13,color:"var(--muted)"}}>เงินที่เตรียมไว้แล้ววันนี้</span>
        <MoneyInput value={s.lump} onChange={n=>up({lump:n})} />
      </div>
      <div style={{borderTop:"1px solid var(--line)",marginTop:12,paddingTop:12}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
          <span style={{fontSize:13}}>ทดลองออมเองเดือนละ</span>
          <MoneyInput value={d.ownC} onChange={n=>up({ownSave:n})} />
        </div>
        <div style={{display:"flex",gap:8,marginTop:8}}>
          <button onClick={()=>up({ownSave:Math.ceil(d.required/500)*500})} style={{flex:1,padding:"9px",borderRadius:10,fontSize:12.5,fontWeight:700,border:"none",background:"var(--accent)",color:"#fff"}}>ใช้ยอดที่แนะนำ ({fmt(Math.ceil(d.required/500)*500)}/เดือน)</button>
        </div>
        <div style={{fontSize:12,marginTop:8,color:d.shortfallYear!=null?"var(--bad)":"var(--good)",fontWeight:600}}>
          {d.shortfallYear!=null
            ? `⚠ ออมเดือนละ ${baht(d.ownC)} จะทำให้กองทุนไม่พอในปีที่ ${d.shortfallYear} (ตอนลูกอายุ ~${d.effAge+d.shortfallYear} ปี)`
            : `✓ ออมเดือนละ ${baht(d.ownC)} เพียงพอตลอดแผน เหลือ ${baht(d.endBal)} เมื่อจบ`}
        </div>
      </div>
    </div>

    <div style={{fontSize:10.5,color:"var(--muted)",textAlign:"center",marginTop:18,lineHeight:1.6}}>
      ประมาณการเชิงการศึกษา ค่าเทอมเป็นค่ากลางตลาดปรับได้ ผลจริงขึ้นกับโรงเรียนและตลาดลงทุน · ไม่เก็บข้อมูลของคุณ<br/>
      <span style={{color:"var(--accent)",fontWeight:700}}>DekFinance · เด็กการเงิน</span>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
